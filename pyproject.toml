[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privacylens"
version = "0.1.0"
description = "Offline context-aware privacy processing for recorded videos"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21,<2.0",
  "opencv-python>=4.5,<5.0",
  "rapidocr-onnxruntime>=1.3,<2.0",
  "PyYAML>=5.3,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

