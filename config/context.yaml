video:
  purpose: "Public programming tutorial"
  audience: "General public"

policy:
  # Plain-language rules for the local language model: what counts as
  # sensitive for this particular video.
  guidance:
    - "Values that belong to production, internal, or customer systems are sensitive."
    - "Values shown as documentation examples that readers are expected to copy or replace are not sensitive."
    - "When unsure, treat the value as sensitive."
  always_replace:
    - API_KEY
    - EMAIL
    - PASSWORD
    - TOKEN
  safe_literals:
    - "<YOUR_API_KEY>"
    - "YOUR_API_KEY"
  safe_networks:
    - "127.0.0.0/8"
  sensitive_context:
    - production
    - private
    - internal
    - customer
  safe_context:
    - documentation
    - example
    - localhost
  sensitive_terms:
    - value: "Project Apollo"
      type: PROJECT_NAME

